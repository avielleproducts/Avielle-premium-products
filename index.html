
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVIELLE | Premium Collection</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf8f4;color:#29251f;font-family:Arial,sans-serif}
header{text-align:center;background:#fff;padding:30px 15px;border-bottom:1px solid #e9e1d7}
.logo{font-family:Georgia,serif;font-size:34px;letter-spacing:7px;margin:0}
.tagline{font-size:11px;letter-spacing:4px;color:#9b8063;margin-top:9px}
.hero{text-align:center;padding:35px 15px 22px}
.hero h1{font-family:Georgia,serif;font-weight:400;font-size:29px;margin:0 0 10px}
.hero p{color:#81776c;font-size:14px}
.filters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px 15px 28px}
.filters button{border:1px solid #b9a58e;background:transparent;color:#493b2c;padding:11px 23px;border-radius:30px;cursor:pointer;font-size:13px}
.filters button.active,.filters button:hover{background:#30271e;color:white;border-color:#30271e}
.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;max-width:1100px;margin:auto;padding:0 20px 55px}
.card{background:white;border:1px solid #eee8df;overflow:hidden}
.card img{width:100%;aspect-ratio:4/5;object-fit:contain;background:#f7f5f1;display:block}
.details{padding:16px}
.category{font-size:10px;letter-spacing:2px;color:#a18461;text-transform:uppercase}
.name{font-family:Georgia,serif;font-size:18px;line-height:1.35;margin:9px 0}
.price{font-size:17px;font-weight:bold}
.old{font-size:13px;color:#999;text-decoration:line-through;margin-left:7px;font-weight:normal}
.save{font-size:11px;color:#7c765f;margin-top:6px}
.order{display:block;text-align:center;text-decoration:none;background:#30271e;color:#fff;padding:12px;margin-top:16px;font-size:12px;letter-spacing:1px}
footer{text-align:center;background:#30271e;color:#eee;padding:28px 15px;font-size:12px;line-height:1.8}
footer strong{font-family:Georgia,serif;letter-spacing:4px;font-size:20px}
@media(max-width:700px){.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 10px 35px}.details{padding:11px}.name{font-size:15px}.price{font-size:14px}.old{font-size:11px}.logo{font-size:29px}}
@media(max-width:390px){.products{grid-template-columns:1fr}.card img{aspect-ratio:1/1}}
</style>
</head>
<body>

<header>
<h1 class="logo">AVIELLE</h1>
<div class="tagline">THE PREMIUM COLLECTION</div>
</header>

<section class="hero">
<h1>Elegance in Every Detail</h1>
<p>Discover thoughtfully selected essentials for your lifestyle.</p>
</section>

<nav class="filters">
<button class="active" onclick="filterProducts('all',this)">All Products</button>
<button onclick="filterProducts('bedsheets',this)">Bedsheets</button>
<button onclick="filterProducts('bags',this)">Bags</button>
</nav>

<main class="products" id="products"></main>

<footer>
<strong>AVIELLE</strong><br>
Premium Products • Made for Everyday Elegance<br>
Order on WhatsApp: +91 89209 73237
</footer>

<script>
const products = [
{category:"bedsheets",name:"Avielle He & She Reversible Premium Bedsheets",old:3599,price:1299,image:"bedsheet_photo_16.png"},
{category:"bedsheets",name:"Avielle Elite King Bedsheets",old:4399,price:849,image:"bedsheet_photo_17.png"},
{category:"bedsheets",name:"Avielle Elite King Bedsheets",old:4399,price:849,image:"bedsheet_photo_18.png"},
{category:"bedsheets",name:"Avielle Elite King Bedsheets",old:4399,price:849,image:"bedsheet_photo_19.png"},
{category:"bedsheets",name:"Avielle Velora 3pcs Bedsheet Set",old:4999,price:1299,image:"bedsheet_photo_20.png"},
{category:"bedsheets",name:"Avielle Velora 3pcs Bedsheet Set",old:4999,price:1299,image:"bedsheet_photo_21.png"},
{category:"bedsheets",name:"Avielle Velora 3pcs Bedsheet Set",old:4999,price:1299,image:"bedsheet_photo_22.png"},
{category:"bedsheets",name:"Avielle Velora 3pcs Bedsheet Set",old:4999,price:1299,image:"bedsheet_photo_23.png"},
{category:"bedsheets",name:"Avielle Velora 3pcs Bedsheet Set",old:4999,price:1299,image:"bedsheet_photo_24.png"},

{category:"bags",name:"Korean Crescent Moon Bag",old:999,price:459,image:"item-1-1.png"},
{category:"bags",name:"Cocoa Charm",old:1799,price:899,image:"item-2-1.png"},
{category:"bags",name:"Monochrome Diamond",old:1799,price:1099,image:"item-3-1.png"},
{category:"bags",name:"Terra Cotta Tote",old:1599,price:1150,image:"item-4-1.png"},
{category:"bags",name:"Checkered Cross Body Box",old:1599,price:850,image:"item-5-1.png"},
{category:"bags",name:"Studded Bag",old:1499,price:950,image:"item-6-1.png"},
{category:"bags",name:"Vintage Floral Embossed Bag",old:1999,price:1599,image:"item-7-1.png"}
];

function render(category="all"){
const area=document.getElementById("products");
area.innerHTML="";
products.filter(p=>category==="all"||p.category===category).forEach(p=>{
const message=encodeURIComponent("Hi AVIELLE, I want to order: "+p.name+" | Price: ₹"+p.price);
const card=document.createElement("article");
card.className="card";
card.innerHTML=`
<img src="${p.image}" alt="${p.name}" loading="lazy">
<div class="details">
<div class="category">${p.category}</div>
<div class="name">${p.name}</div>
<div class="price">₹${p.price.toLocaleString("en-IN")} <span class="old">₹${p.old.toLocaleString("en-IN")}</span></div>
<div class="save">Special collection price</div>
<a class="order" href="https://wa.me/918920973237?text=${message}" target="_blank" rel="noopener">ORDER ON WHATSAPP</a>
</div>`;
area.appendChild(card);
});
}
function filterProducts(category,button){
document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
render(category);
}
render();
</script>
</body>
</html>
